<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YTTM 읽기 전용 Firestore 검증</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 850px;
        margin: 40px auto;
        padding: 16px;
        line-height: 1.6;
      }
      label {
        display: block;
        margin: 14px 0;
      }
      input {
        min-width: 300px;
        padding: 8px;
      }
      button,
      select {
        padding: 8px 12px;
        margin: 4px;
      }
      pre {
        white-space: pre-wrap;
        background: #f4f4f4;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Firestore 읽기 전용 검증</h1>
    <p>
      운영 프로젝트: yttm-38af5. 기존 Google 계정만 사용하세요. 영상·메모·컬렉션을
      생성·수정·삭제하지 않습니다.
    </p>
    <p>
      인증은 이 탭 메모리에만 유지됩니다. 토큰과 문서 본문은 출력하지 않습니다. 각 계정이 자신의
      영상 조회에 성공하고 상대 영상 조회가 거부돼야 합니다.
    </p>
    <label>계정 A의 영상 문서 ID <input id="video-a" autocomplete="off" /></label>
    <label>계정 B의 영상 문서 ID <input id="video-b" autocomplete="off" /></label>
    <label
      >현재 로그인할 계정 역할
      <select id="role">
        <option value="a">계정 A</option>
        <option value="b">계정 B</option>
      </select></label
    >
    <button id="login" disabled>Google 계정 선택</button>
    <button id="run" disabled>읽기 전용 검증 실행</button>
    <button id="logout" disabled>검증 로그인 해제</button>
    <p id="account">로그인 전</p>
    <p id="status" role="status">준비 중…</p>
    <pre id="results" aria-label="검증 결과">아직 실행하지 않았습니다.</pre>
    <script type="module" src="/probe.js"></script>
  </body>
</html>
